<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Destapa la Palabra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Fredoka:wght@400;600;700&display=swap">
<style>
/* Layout: un solo pantallazo tipo app de juego. Arriba la fila de tarjetitas (progreso),
   en el centro la tarjeta grande que se destapa, debajo el mensaje con 🔊 y 💡, las
   cajitas de letras agrupadas por sílabas y el teclado gigante con solo las teclas que el
   nivel necesita. Todo redondo, brillante y con stickers. */
:root{
  --bg:#fff4fa;
  --papel:#ffffff;
  --tinta:#4b2a6e;
  --tinta-suave:#8f6db0;
  --rosa:#ff7fb5;
  --rosa-oscuro:#e0528f;
  --amarillo:#ffd93b;
  --amarillo-oscuro:#e6b800;
  --cielo:#7fd3ff;
  --cielo-oscuro:#3fa9e8;
  --menta:#8ff0b8;
  --menta-oscuro:#3fcf85;
  --lila:#cfa7ff;
  --lila-oscuro:#9c6ae0;
  --naranja:#ffb066;
  --naranja-oscuro:#e8863a;
  --bien:#3ccf7a;
  --mal:#ff6b6b;
  --fantasma:#d9cfe6;
  --display:'Baloo 2','Fredoka','Comic Sans MS','Chalkboard SE','Marker Felt',cursive,sans-serif;
  --cuerpo:'Fredoka','Comic Sans MS','Chalkboard SE','Marker Felt',sans-serif;
  --alto-tarjeta:min(36vh,290px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--cuerpo);
  font-size:18px;
  color:var(--tinta);
  background:var(--bg);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,217,59,.45) 0 26px, transparent 27px),
    radial-gradient(circle at 88% 12%, rgba(127,211,255,.45) 0 34px, transparent 35px),
    radial-gradient(circle at 80% 85%, rgba(255,127,181,.4) 0 40px, transparent 41px),
    radial-gradient(circle at 10% 80%, rgba(143,240,184,.5) 0 30px, transparent 31px),
    radial-gradient(circle at 50% 50%, rgba(207,167,255,.25) 0 60px, transparent 61px);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
img{max-width:100%}
[hidden]{display:none!important}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--cielo-oscuro);outline-offset:3px}

.app{
  min-height:100%;
  display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px 18px;
  max-width:720px;margin:0 auto;
  gap:10px;
}
.app.jugando .pie{display:none}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{
  font-family:var(--display);font-weight:800;font-size:clamp(20px,5vw,28px);
  color:var(--rosa-oscuro);
  text-shadow:2px 2px 0 #fff;
  letter-spacing:.5px;
}
.top-btns{display:flex;gap:8px}
.btn-redondo{
  width:46px;height:46px;border-radius:50%;
  background:var(--papel);
  box-shadow:0 4px 0 var(--lila-oscuro);
  font-size:22px;display:grid;place-items:center;
  transition:transform .1s;
}
.btn-redondo:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lila-oscuro)}
.btn-redondo.apagado{opacity:.55;filter:grayscale(1)}

/* ---------- botones grandes ---------- */
.btn{
  font-family:var(--display);font-weight:800;
  font-size:22px;line-height:1;
  padding:16px 26px;border-radius:999px;
  background:var(--amarillo);color:var(--tinta);
  box-shadow:0 6px 0 var(--amarillo-oscuro);
  transition:transform .1s, box-shadow .1s;
  text-wrap:balance;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--amarillo-oscuro)}
.btn.rosa{background:var(--rosa);box-shadow:0 6px 0 var(--rosa-oscuro);color:#fff}
.btn.rosa:active{box-shadow:0 2px 0 var(--rosa-oscuro)}
.btn.cielo{background:var(--cielo);box-shadow:0 6px 0 var(--cielo-oscuro)}
.btn.cielo:active{box-shadow:0 2px 0 var(--cielo-oscuro)}
.btn.menta{background:var(--menta);box-shadow:0 6px 0 var(--menta-oscuro)}
.btn.menta:active{box-shadow:0 2px 0 var(--menta-oscuro)}
.btn.lila{background:var(--lila);box-shadow:0 6px 0 var(--lila-oscuro)}
.btn.lila:active{box-shadow:0 2px 0 var(--lila-oscuro)}
.btn.chico{font-size:17px;padding:12px 18px}
.btn.grande{font-size:24px;padding:18px 28px}
.btn[disabled]{opacity:.45;cursor:default;transform:none}

/* ---------- pantalla inicio (es para la profe) ---------- */
.screen{display:flex;flex-direction:column;gap:14px;flex:1}
.hero{
  background:var(--papel);
  border:5px dashed var(--rosa);
  border-radius:32px;
  padding:14px 12px 18px;
  text-align:center;
  display:flex;flex-direction:column;gap:8px;align-items:center;
  box-shadow:0 10px 0 rgba(255,127,181,.25);
}
.hero h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(30px,8vw,46px);margin:0;line-height:1.05;
  color:var(--lila-oscuro);
  text-shadow:3px 3px 0 var(--amarillo);
  text-wrap:balance;
}
.hero p{margin:0;font-size:19px;max-width:38ch;line-height:1.4}
.hero .profe-elige{font-size:15px;color:var(--tinta-suave);font-weight:600}
.emojis-hero{font-size:32px;letter-spacing:6px;line-height:1;animation:flotar 3s ease-in-out infinite}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.niveles{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.nivel-btn{
  position:relative;min-height:72px;border-radius:22px;
  padding:10px 6px 10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--tinta);transition:transform .1s;
}
.nivel-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.nivel-btn.n1{background:var(--amarillo);box-shadow:0 6px 0 var(--amarillo-oscuro)}
.nivel-btn.n2{background:var(--menta);box-shadow:0 6px 0 var(--menta-oscuro)}
.nivel-btn.n3{background:var(--cielo);box-shadow:0 6px 0 var(--cielo-oscuro)}
.nivel-btn.n4{background:var(--rosa);box-shadow:0 6px 0 var(--rosa-oscuro);color:#fff}
.nivel-btn.n5{background:var(--lila);box-shadow:0 6px 0 var(--lila-oscuro)}
.nivel-btn.n6{background:var(--naranja);box-shadow:0 6px 0 var(--naranja-oscuro)}
.nivel-btn .em{font-size:48px;line-height:1}
.nivel-btn .tit{display:flex;align-items:baseline;gap:5px;line-height:1}
.nivel-btn .num{font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.nivel-btn .nom{font-size:13px;font-weight:600;line-height:1.1}
.nivel-btn .ej{display:flex;gap:3px;margin-top:2px}
.nivel-btn .ej span{
  width:18px;height:22px;border-radius:5px;
  border:2px solid var(--amarillo-oscuro);background:#fff8d6;
  font-family:var(--display);font-weight:800;font-size:13px;color:var(--tinta);
  display:grid;place-items:center;line-height:1;
}
.nivel-btn .ej span.hueco{background:#f6f2fb;border:2px dashed var(--fantasma)}
.nivel-btn .ej span.fant{color:var(--fantasma)}
.nivel-btn .mejor{font-size:13px;font-weight:600;color:inherit;opacity:.85;line-height:1}
.nivel-btn .empieza{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  background:var(--rosa-oscuro);color:#fff;font-size:12px;font-weight:700;
  padding:3px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.15);
}

.nombre{display:flex;flex-direction:column;gap:6px;align-items:center;font-weight:600;font-size:16px}
.nombre input{
  font-family:var(--display);font-weight:800;font-size:22px;text-align:center;
  width:min(100%,240px);padding:8px 14px;border-radius:999px;
  border:4px solid var(--lila);background:#fff;color:var(--tinta);
}
.profe{width:100%;text-align:center}
.profe summary{
  cursor:pointer;font-family:var(--display);font-weight:800;font-size:18px;color:var(--lila-oscuro);
  list-style:none;padding:8px;border-radius:999px;background:#f6f2fb;
}
.profe summary::-webkit-details-marker{display:none}
.profe-body{display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:10px}
.titulo-fichas{font-family:var(--display);font-weight:800;font-size:18px;margin:0;color:var(--rosa-oscuro)}
.fichas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ficha{
  font-family:var(--display);font-weight:800;font-size:22px;
  width:52px;height:52px;border-radius:16px;
  display:grid;place-items:center;color:var(--tinta);
  transition:transform .1s;opacity:.6;
}
.ficha.on{opacity:1;outline:4px solid var(--tinta);outline-offset:2px}
.ficha:active{transform:scale(.94)}
.ficha.m{background:var(--rosa);box-shadow:0 5px 0 var(--rosa-oscuro);color:#fff}
.ficha.p{background:var(--cielo);box-shadow:0 5px 0 var(--cielo-oscuro)}
.ficha.s{background:var(--menta);box-shadow:0 5px 0 var(--menta-oscuro)}
.ficha.l{background:var(--lila);box-shadow:0 5px 0 var(--lila-oscuro)}
.ficha.todas{width:auto;padding:0 16px;font-size:17px;background:var(--amarillo);box-shadow:0 5px 0 var(--amarillo-oscuro)}
.opciones{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-weight:600;font-size:16px;color:var(--tinta-suave)}
.opciones label{display:flex;align-items:center;gap:6px}
.opciones input{width:22px;height:22px;accent-color:var(--rosa-oscuro)}

/* ---------- pantalla juego ---------- */
.progreso{display:flex;align-items:center;gap:10px}
.deck{
  display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;padding:6px 2px;
  scrollbar-width:none;scroll-behavior:smooth;
}
.deck::-webkit-scrollbar{display:none}
.mini{
  flex:0 0 auto;width:40px;height:48px;border-radius:10px;
  background:var(--lila);
  display:grid;place-items:center;font-size:20px;color:#fff;
  font-family:var(--display);font-weight:800;
  box-shadow:0 3px 0 var(--lila-oscuro);
  position:relative;transition:transform .2s;
}
.mini svg{width:26px;height:26px}
.mini.actual{background:var(--amarillo);color:var(--tinta);box-shadow:0 3px 0 var(--amarillo-oscuro);transform:scale(1.12);animation:latido 1.2s ease-in-out infinite}
.mini.lista{background:#fff;box-shadow:0 3px 0 var(--menta-oscuro)}
.mini.lista::after{content:"⭐";position:absolute;right:-7px;top:-9px;font-size:14px}
.mini.saltada{background:#e9e3f0;box-shadow:0 3px 0 #bdb3c9;opacity:.6;filter:grayscale(1)}
.mini.rebote{animation:rebote .6s cubic-bezier(.3,1.6,.6,1)}
@keyframes latido{0%,100%{transform:scale(1.12)}50%{transform:scale(1.2)}}
@keyframes rebote{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.estrellas{
  font-family:var(--display);font-weight:800;font-size:20px;
  background:var(--papel);padding:8px 14px;border-radius:999px;
  box-shadow:0 4px 0 var(--amarillo-oscuro);white-space:nowrap;
  font-variant-numeric:tabular-nums;
}

.escena{display:grid;place-items:center;padding:6px 0;perspective:1200px;overflow:hidden}
.tarjeta{
  width:min(62vw, 250px, calc(var(--alto-tarjeta) * 0.87));aspect-ratio:4/4.6;max-width:100%;
  position:relative;transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.4,1.4,.6,1);
  cursor:pointer;
}
.tarjeta.abierta{transform:rotateY(180deg)}
.tarjeta.salir{animation:salir .55s ease-in forwards}
.tarjeta.entrar{animation:entrar .55s cubic-bezier(.3,1.4,.6,1)}
@keyframes salir{to{transform:translateX(-140%) rotate(-12deg);opacity:0}}
@keyframes entrar{from{transform:translateX(140%) rotate(12deg);opacity:0}to{transform:translateX(0) rotate(0);opacity:1}}
.cara{
  position:absolute;inset:0;border-radius:28px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 10px 0 rgba(75,42,110,.18), 0 14px 30px rgba(75,42,110,.15);
}
.dorso{
  background:var(--rosa);
  background-image:radial-gradient(circle, rgba(255,255,255,.55) 0 7px, transparent 8px);
  background-size:34px 34px;
  border:6px solid #fff;
  color:#fff;
}
.dorso .signo{
  font-family:var(--display);font-weight:800;font-size:clamp(60px,24vw,120px);line-height:1;
  text-shadow:4px 4px 0 var(--rosa-oscuro);
}
.dorso .toca{
  font-family:var(--display);font-weight:800;font-size:18px;
  background:#fff;color:var(--rosa-oscuro);padding:5px 14px;border-radius:999px;
}
.tarjeta:not(.abierta):not(.salir):not(.entrar){animation:menear 2.2s ease-in-out infinite}
.tarjeta.menear-mas:not(.abierta):not(.salir):not(.entrar){animation:menear-mas 1.1s ease-in-out infinite}
@keyframes menear{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes menear-mas{0%,100%{transform:rotate(-7deg) scale(1.03)}50%{transform:rotate(7deg) scale(1.03)}}
.frente{
  transform:rotateY(180deg);
  background:var(--papel);
  border:6px solid var(--amarillo);
}
.dibujo{
  font-size:clamp(70px,24vw,150px);line-height:1;
  display:grid;place-items:center;
  width:72%;max-height:70%;aspect-ratio:1;max-width:100%;
}
.dibujo svg{width:100%;height:100%}
.silabas{
  font-family:var(--display);font-weight:800;font-size:22px;color:var(--lila-oscuro);
  letter-spacing:2px;min-height:26px;line-height:1.1;
}

.mensaje-fila{display:flex;align-items:center;justify-content:center;gap:10px}
.mensaje{
  flex:1;min-width:0;
  text-align:center;font-family:var(--display);font-weight:800;
  font-size:clamp(19px,5vw,24px);min-height:32px;color:var(--tinta);line-height:1.15;
  text-wrap:balance;
}
.mensaje.bien{color:var(--bien)}
.mensaje.mal{color:var(--rosa-oscuro)}
.mensaje.pista{color:var(--lila-oscuro)}
.btn-ayuda{
  flex:0 0 auto;width:56px;height:56px;border-radius:50%;
  font-size:26px;display:grid;place-items:center;
  transition:transform .1s, box-shadow .1s;
}
.btn-ayuda.oir{background:var(--cielo);box-shadow:0 5px 0 var(--cielo-oscuro)}
.btn-ayuda.oir:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cielo-oscuro)}
.btn-ayuda.pista{background:var(--lila);box-shadow:0 5px 0 var(--lila-oscuro)}
.btn-ayuda.pista:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lila-oscuro)}
.btn-ayuda[disabled]{opacity:.45;cursor:default;transform:none}

/* cajitas agrupadas por sílabas: 6 px entre letras, 16 px entre sílabas */
.cajas{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding-bottom:26px;min-height:80px}
.silaba{display:flex;gap:6px}
.caja{
  position:relative;
  width:clamp(44px,12vw,70px);height:clamp(54px,14vw,70px);
  border-radius:14px;background:var(--papel);
  border:4px solid var(--lila);
  display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,40px);
  color:var(--tinta);transition:transform .15s, border-color .15s, background .15s;
}
.caja.fija{background:#fff8d6;border-color:var(--amarillo-oscuro)}
.caja.vacia{background:#f1ecf7;border-color:var(--fantasma);opacity:.55}
.caja.fantasma{color:var(--fantasma)}
.caja.actual{
  background:#fff;border:5px solid var(--rosa);
  box-shadow:0 0 0 4px rgba(255,127,181,.3);
  transform:scale(1.12);animation:latir 1s ease-in-out infinite;z-index:1;
}
.caja.actual::after{
  content:"👆";position:absolute;left:50%;bottom:-30px;font-size:22px;line-height:1;
  transform:translateX(-50%);animation:manita .8s ease-in-out infinite;
}
@keyframes latir{0%,100%{transform:scale(1.12)}50%{transform:scale(1.18)}}
@keyframes manita{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}
.caja.bien{background:#e2fbe9;border-color:var(--bien);opacity:1}
.caja.salta{animation:salto .5s ease}
.caja.mal{background:#ffe3e3;border-color:var(--mal);color:var(--mal);opacity:1}
.caja.tiembla{animation:tiembla .3s ease}
.caja.recordar{animation:recordar .6s ease}
.cajas.temblar{animation:temblar .5s ease}
@keyframes salto{0%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-6deg)}100%{transform:translateY(0)}}
@keyframes tiembla{0%,100%{transform:translateX(0) scale(1.12)}25%{transform:translateX(-8px) scale(1.12)}75%{transform:translateX(8px) scale(1.12)}}
@keyframes recordar{0%,100%{transform:scale(1.12)}50%{transform:translateY(-22px) scale(1.25)}}
@keyframes temblar{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}

.teclado{
  display:flex;flex-direction:column;gap:10px;align-items:center;
  background:var(--papel);border-radius:28px;padding:14px 10px;
  border:5px solid var(--cielo);
  transition:opacity .3s;
}
.teclado.dormido{opacity:.45;pointer-events:none}
.fila{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tecla{
  width:clamp(48px,13vw,66px);height:clamp(52px,13vw,66px);
  border-radius:18px;
  font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,34px);
  color:var(--tinta);
  transition:transform .08s, box-shadow .08s;
  display:grid;place-items:center;
}
/* niveles 1 a 5: una sola fila de teclas más grandes, sin ⌫ */
.teclado.simple{padding:10px 3px;margin-inline:-10px}
.teclado.simple .fila{gap:5px}
.teclado.simple .tecla{width:clamp(60px,17vw,84px);height:clamp(64px,17vw,84px);font-size:clamp(32px,9vw,44px)}
.tecla:active,.tecla.pulsada{transform:translateY(4px)}
.tecla.vocal{background:var(--amarillo);box-shadow:0 5px 0 var(--amarillo-oscuro)}
.tecla.vocal:active,.tecla.vocal.pulsada{box-shadow:0 1px 0 var(--amarillo-oscuro)}
.tecla.cons{background:var(--cielo);box-shadow:0 5px 0 var(--cielo-oscuro)}
.tecla.cons:active,.tecla.cons.pulsada{box-shadow:0 1px 0 var(--cielo-oscuro)}
.tecla.cons.m{background:var(--rosa);box-shadow:0 5px 0 var(--rosa-oscuro);color:#fff}
.tecla.cons.m:active,.tecla.cons.m.pulsada{box-shadow:0 1px 0 var(--rosa-oscuro)}
.tecla.cons.s{background:var(--menta);box-shadow:0 5px 0 var(--menta-oscuro)}
.tecla.cons.s:active,.tecla.cons.s.pulsada{box-shadow:0 1px 0 var(--menta-oscuro)}
.tecla.cons.l{background:var(--lila);box-shadow:0 5px 0 var(--lila-oscuro)}
.tecla.cons.l:active,.tecla.cons.l.pulsada{box-shadow:0 1px 0 var(--lila-oscuro)}
.tecla.borrar{width:auto;padding:0 18px;font-size:22px;background:#ffe3e3;box-shadow:0 5px 0 var(--mal)}
.tecla.borrar:active{box-shadow:0 1px 0 var(--mal)}
.tecla.brilla{outline:5px solid var(--amarillo-oscuro);outline-offset:3px;animation:brillar .7s ease-in-out infinite;z-index:1}
@keyframes brillar{0%,100%{transform:scale(1.15)}50%{transform:scale(1.05)}}
.acciones{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- pantalla final ---------- */
.final-caja{
  background:var(--papel);border:6px solid var(--amarillo);border-radius:36px;
  padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;
  box-shadow:0 10px 0 rgba(255,217,59,.4);
}
.medalla{font-size:96px;line-height:1;animation:flotar 2.4s ease-in-out infinite}
.final-caja h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,42px);margin:0;color:var(--rosa-oscuro);text-shadow:3px 3px 0 var(--amarillo);text-wrap:balance}
.puntaje{font-family:var(--display);font-weight:800;font-size:30px;color:var(--lila-oscuro);font-variant-numeric:tabular-nums}

const VOCALES = ['a','e','i','o','u'];
const CONSONANTES = ['m','p','s','l'];
const esVocal = ch => VOCALES.includes(ch);

/* ---------- utilidades ---------- */

const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const capital = s => s.charAt(0).toUpperCase() + s.slice(1);

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const guardar = (k,v) => { try{ localStorage.setItem('destapa.'+k, JSON.stringify(v)); }catch(e){} };
const leer = (k,def) => { try{ const v=localStorage.getItem('destapa.'+k); return v===null?def:JSON.parse(v); }catch(e){ return def; } };

/* sílabas de una palabra y sílaba que contiene la letra i (con su tilde: «má») */
const silabas = p => p.s.split('-');
function silabaDe(p, i){
  let k = 0;
  for(const s of silabas(p)){ if(i < k + s.length) return s; k += s.length; }
  return p.w;
}
const indicesDonde = (p, cond) => norm(p.w).split('').map((ch,i)=>cond(ch)?i:-1).filter(i=>i>=0);
/* nivel 2: la última letra de la palabra; si empieza por vocal, la primera. Nunca la del medio. */
function huecoVocal(p){
  const r = norm(p.w);
  if(esVocal(r[0])) return 0;
  for(let i=r.length-1;i>0;i--) if(esVocal(r[i])) return i;
  return r.length-1;
}

/* ---------- los 6 niveles, de más fácil a más difícil ----------
   huecos(palabra) devuelve los índices que quedan vacíos; las demás letras se regalan. */
const NIVELES = [

/* ---------- sonido (notas sencillas, sin archivos) ---------- */
let sonido = leer('sonido', true);
let actx = null;
function ctxAudio(){
  try{
    if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; actx = new AC(); }
    if(actx.state==='suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function nota(freq, dur, t0, tipo, vol){
  const c = ctxAudio(); if(!c || !sonido) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = tipo||'triangle'; o.frequency.value = freq;
  const t = c.currentTime + (t0||0);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.25, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+dur+0.05);
}
const sonar = {
  tecla(){ nota(660,0.08,0,'square',0.08); },
  tin(){ nota(880,0.1,0,'sine',0.2); nota(1320,0.14,0.07,'sine',0.16); },
  voltear(){ nota(440,0.12,0,'sine',0.2); nota(660,0.12,0.1,'sine',0.2); },
  bien(){ [523,659,784,1047].forEach((f,i)=>nota(f,0.22,i*0.11,'triangle',0.25)); },

  pista(){ nota(880,0.1,0,'sine',0.2); nota(1175,0.18,0.1,'sine',0.2); },

/* ---------- voz (lee palabras y consignas; funciona sin internet en la mayoría de equipos) ----------
   Devuelve una promesa que se resuelve cuando la locución termina (o enseguida si no hay voz).
   Siempre cancela la locución anterior: cada evento produce una sola locución. */
function hablar(texto){
  return new Promise(listo=>{
    try{
      if(!sonido || !('speechSynthesis' in window)){ listo(); return; }
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = 'es-ES'; u.rate = 0.8; u.pitch = 1.1;
      const voces = speechSynthesis.getVoices();
      const v = voces.find(v=>/^es[-_](CO|MX|US|419)/i.test(v.lang)) || voces.find(v=>/^es/i.test(v.lang));
      if(v) u.voice = v;
      u.onend = ()=>listo(); u.onerror = ()=>listo();
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }catch(e){ listo(); }
  });
}
function callar(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }
try{ if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = ()=>speechSynthesis.getVoices(); } }catch(e){}

/* ---------- confeti ---------- */

const COLORES = ['#ff7fb5','#ffd93b','#7fd3ff','#8ff0b8','#cfa7ff','#ffb066'];
function confeti(n){

  for(let i=0;i<n;i++){
    particulas.push({x:innerWidth/2 + (Math.random()-0.5)*120, y:innerHeight*0.45,
      vx:(Math.random()-0.5)*14, vy:-Math.random()*12-4,
      r:Math.random()*7+4, c:COLORES[i%COLORES.length], rot:Math.random()*6, vr:(Math.random()-0.5)*0.3, vida:1});
  }
  if(!animando){ animando=true; requestAnimationFrame(pintar); }
}
function pintar(){
  ctx2d.clearRect(0,0,innerWidth,innerHeight);
  particulas.forEach(p=>{ p.vy+=0.35; p.x+=p.vx; p.y+=p.vy; p.vx*=0.99; p.rot+=p.vr; p.vida-=0.012;
    ctx2d.save(); ctx2d.translate(p.x,p.y); ctx2d.rotate(p.rot); ctx2d.globalAlpha=Math.max(p.vida,0);
    ctx2d.fillStyle=p.c; ctx2d.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); ctx2d.restore(); });
  particulas = particulas.filter(p=>p.vida>0 && p.y<innerHeight+40);
  if(particulas.length){ requestAnimationFrame(pintar); } else { animando=false; ctx2d.clearRect(0,0,innerWidth,innerHeight); }
}

/* ---------- estado del juego ---------- */
const estado = {
  nivel:null,          // objeto de NIVELES
  letra:'todas',       // filtro de la profe: m, p, s, l o todas
  nombre:'',
  lista:[], idx:0,     // ronda de palabras y tarjeta actual
  huecos:[],           // índices que el niño debe llenar
  escrito:[],          // letra en cada cajita ('' si está vacía)
  fijas:[],            // cajitas que el nivel regala (o que puso la pista del nivel 6)
  bien:[],             // cajitas acertadas (niveles por letra)
  erroresCaja:[],      // escalera de ayuda: errores por cajita
  fantasma:-1,         // cajita que muestra la letra fantasma
  destapada:false, ocupado:false,
  pistas:0, errores:0, ayudaMax:0, recordatorios:0,   // por tarjeta
  estrellas:0, resultados:[]                           // por ronda
};
let minusculas = leer('minus', false);
const mostrar = ch => minusculas ? ch.toLowerCase() : ch.toUpperCase();
const palabraActual = () => estado.lista[estado.idx];
const cajaActiva = () => estado.escrito.findIndex((l,i)=>!l && !estado.fijas[i]);
const locucionDestapar = () => estado.nivel.voz(palabraActual(), estado.huecos);

/* lista de palabras de la ronda según el nivel y la letra elegida por la profe */
function listaParaNivel(nivel, letra){
  const base = PALABRAS.filter(p=>nivel.grupos.includes(p.g) && (!nivel.apta || nivel.apta(p)));
  let elegidas;
  if(letra==='todas'){
    elegidas = barajar(base).slice(0, nivel.tarjetas);
  } else if(nivel.id===3){
    // 3 tarjetas con la letra elegida y 2 distractores con otra consonante
    const con = barajar(base.filter(p=>norm(p.w)[0]===letra)).slice(0, 3);
    const otras = barajar(base.filter(p=>norm(p.w)[0]!==letra)).slice(0, nivel.tarjetas - con.length);
    elegidas = con.concat(otras);
  } else {
    elegidas = barajar(base.filter(p=>norm(p.w).includes(letra))).slice(0, nivel.tarjetas);
  }
  if(elegidas.length < nivel.tarjetas){
    // la lista filtrada quedó corta: se completa con palabras de «Todas» del mismo grupo
    const resto = barajar(base.filter(p=>!elegidas.includes(p)));
    elegidas = elegidas.concat(resto.slice(0, nivel.tarjetas - elegidas.length));
  }
  return separarRepetidas(barajar(elegidas), nivel.clave);
}
/* una pasada simple para que dos tarjetas seguidas no tengan la misma clave (vocal faltante o letra inicial) */
function separarRepetidas(lista, clave){
  if(!clave) return lista;
  const a = lista.slice();
  for(let i=1;i<a.length;i++){
    if(clave(a[i])!==clave(a[i-1])) continue;
    const j = a.findIndex((p,k)=>k>i && clave(p)!==clave(a[i-1]));
    if(j>0){ [a[i],a[j]] = [a[j],a[i]]; }
  }
  return a;
}

/* ---------- pantallas ---------- */
function irA(id){
  ['inicio','juego','final'].forEach(s=>{ $(s).hidden = (s!==id); });
  document.querySelector('.app').classList.toggle('jugando', id==='juego');
  $('btn-saltar').hidden = (id!=='juego');
  window.scrollTo(0,0);
}

function mejorDe(id){
  const m = leer('mejor.'+id, null);
  return (m && typeof m.estrellas==='number') ? m : null;
}
function pintarInicio(){
  const cont = $('niveles'); cont.innerHTML='';
  const ultimo = leer('ultimoNivel', 0);
  const empiezaEn = Math.min((typeof ultimo==='number' ? ultimo : 0) + 1, 6);

      <span class="em">${n.emoji}</span><span class="tit"><span class="num">${n.id}</span><span class="nom">${n.nombre}</span></span>
      <span class="ej">${ej}</span>${m ? `<span class="mejor">⭐ ${m.estrellas}/${m.total}</span>` : ''}`;
    b.addEventListener('click', ()=>{ empezar(n.id); });
    cont.appendChild(b);
  });
}

/* ---------- teclado ---------- */
function construirTeclado(nivel, letraFaltante){
  const t = $('teclado'); t.innerHTML='';
  let filas;
  if(nivel.teclas==='todas') filas = [VOCALES, CONSONANTES];
  else if(nivel.teclas==='vocales') filas = [VOCALES];
  else if(nivel.teclas==='cons') filas = [CONSONANTES];
  else filas = [esVocal(letraFaltante) ? VOCALES : CONSONANTES];
  t.classList.toggle('simple', nivel.teclas!=='todas');
  filas.forEach((letras, f)=>{
    const fila = document.createElement('div'); fila.className='fila';
    letras.forEach(l=>{
      const b=document.createElement('button');
      b.className = 'tecla ' + (esVocal(l) ? 'vocal' : 'cons '+l);
      b.textContent = mostrar(l); b.dataset.letra = l;
      b.setAttribute('aria-label','Letra '+l.toUpperCase()); fila.appendChild(b);
    });
    if(nivel.teclas==='todas' && f===1){
      const borrar=document.createElement('button'); borrar.className='tecla borrar'; borrar.textContent='⌫';
      borrar.dataset.accion='borrar'; borrar.setAttribute('aria-label','Borrar'); fila.appendChild(borrar);
    }
    t.appendChild(fila);
  });
}
$('teclado').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.letra) tocarTecla(b.dataset.letra);
  else if(b.dataset.accion==='borrar') borrar();
});
document.addEventListener('keydown', e=>{
  if($('juego').hidden || !estado.nivel) return;
  if(e.target && e.target.tagName==='INPUT') return;
  const k = e.key;
  if(k==='Backspace'){ if(estado.nivel.chequeo==='palabra'){ e.preventDefault(); borrar(); } return; }
  if(k==='Enter' || k===' '){ if(!estado.destapada){ e.preventDefault(); destapar(); } return; }
  if(k.length===1){
    const l = norm(k);
    if(NOMBRES[l]){ e.preventDefault(); tocarTecla(l); }
  }
});
function marcarTecla(l){
  const b = $('teclado').querySelector(`[data-letra="${l}"]`); if(!b) return;
  b.classList.add('pulsada'); setTimeout(()=>b.classList.remove('pulsada'),120);
}
function brillar(l){ quitarBrillo(); const b = $('teclado').querySelector(`[data-letra="${l}"]`); if(b) b.classList.add('brilla'); }
function quitarBrillo(){ $('teclado').querySelectorAll('.brilla').forEach(b=>b.classList.remove('brilla')); }

/* ---------- temporizadores (toca la tarjeta / inactividad) ---------- */
let tTocar = null, tInactivo = null;
function cancelarTemporizadores(){ clearTimeout(tTocar); clearTimeout(tInactivo); tTocar = tInactivo = null; }
function programarTocar(){
  clearTimeout(tTocar);
  tTocar = setTimeout(()=>{
    if(estado.destapada || $('juego').hidden) return;
    $('tarjeta').classList.add('menear-mas');
    hablar('Toca la tarjeta');
  }, 10000);
}
function reiniciarInactividad(){
  clearTimeout(tInactivo); tInactivo = null;
  if(!estado.nivel || estado.nivel.chequeo!=='letra' || !estado.destapada || estado.recordatorios>=2) return;
  tInactivo = setTimeout(recordar, 8000);
}
function recordar(){
  if(!estado.destapada || $('juego').hidden) return;
  if(estado.ocupado){ reiniciarInactividad(); return; }
  const i = cajaActiva(); if(i<0) return;
  estado.recordatorios++;
  if(estado.recordatorios===1){
    hablar(locucionDestapar());
    pintarCajas({recordar:i});
    reiniciarInactividad();
  } else {
    estado.erroresCaja[i] = Math.max(estado.erroresCaja[i], 2);
    escalon(i, 2);
  }
}

/* ---------- tarjeta ---------- */
function cargarTarjeta(){
  const p = palabraActual(), nivel = estado.nivel, real = norm(p.w), n = real.length;
  estado.huecos = nivel.huecos(p);
  estado.fijas = Array.from({length:n}, (_,i)=>!estado.huecos.includes(i));
  estado.escrito = real.split('').map((ch,i)=>estado.fijas[i] ? ch : '');
  estado.bien = Array(n).fill(false);
  estado.erroresCaja = Array(n).fill(0);
  estado.fantasma = nivel.id===1 ? estado.huecos[0] : -1;
  estado.destapada=false; estado.ocupado=false;
  estado.pistas=0; estado.errores=0; estado.ayudaMax=0; estado.recordatorios=0;
  const d = $('dibujo');
  d.innerHTML = p.svg ? SVG[p.svg] : `<span>${p.img}</span>`;
  d.setAttribute('aria-label', p.w);
  $('silabas').textContent = '';
  $('tarjeta').classList.remove('abierta','salir','menear-mas');
  construirTeclado(nivel, real[estado.huecos[0]]);
  $('teclado').classList.add('dormido');
  $('btn-pista').disabled = true;
  mensaje('👆 ¡Toca la tarjeta!', '', false);
  pintarCajas(); pintarDeck();
}
function destapar(){
  if(estado.destapada || estado.ocupado) return;
  estado.destapada = true;
  clearTimeout(tTocar);
  $('tarjeta').classList.add('abierta'); $('tarjeta').classList.remove('menear-mas');
  $('teclado').classList.remove('dormido');
  $('btn-pista').disabled = false;
  sonar.voltear();
  mensaje(estado.nivel.mensaje, '', false);
  pintarCajas();
  setTimeout(()=>{ if(estado.destapada && !estado.ocupado) hablar(locucionDestapar()); }, 500);
  reiniciarInactividad();
}
$('tarjeta').addEventListener('click', destapar);
$('tarjeta').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); destapar(); } });
$('btn-oir').addEventListener('click', ()=>{
  if(!estado.nivel) return;
  if(estado.destapada){ reiniciarInactividad(); hablar(locucionDestapar()); }
  else hablar('Toca la tarjeta');
});

/* escribe el mensaje en pantalla y, salvo que voz === false, lo dice (voz || texto sin emojis) */
function mensaje(txt, clase, voz){
  const m = $('mensaje'); m.textContent = txt; m.className = 'mensaje' + (clase?' '+clase:'');
  if(voz !== false) hablar(voz || sinEmojis(txt));
}

/* ---------- cajitas (agrupadas por sílabas) ---------- */
function pintarCajas(extra){
  extra = extra || {};
  const p = palabraActual(), c = $('cajas'); c.innerHTML='';
  const prox = cajaActiva();
  let i = 0;
  silabas(p).forEach(sil=>{
    const g = document.createElement('div'); g.className='silaba';
    for(const ch of sil){
      const k = i++;
      const d = document.createElement('div'); d.className='caja'; d.dataset.i = k;
      const marca = extra.marcas && extra.marcas[k];
      let letra = (estado.fijas[k] || extra.mostrarReal) ? ch : estado.escrito[k];
      if(estado.fijas[k]) d.classList.add('fija');
      if(estado.bien[k] || marca==='bien') d.classList.add('bien');
      if(marca==='mal') d.classList.add('mal');
      if(extra.temporal && extra.temporal.i===k){ letra = extra.temporal.l; d.classList.add('mal','tiembla'); }
      if(extra.saltar==='todas' || extra.saltar===k) d.classList.add('salta');
      if(extra.recordar===k) d.classList.add('recordar');
      const activa = estado.destapada && k===prox && !extra.bloquear;
      if(activa) d.classList.add('actual');
      else if(!letra && !estado.fijas[k]) d.classList.add('vacia');
      if(!letra && estado.fantasma===k){ letra = norm(ch); d.classList.add('fantasma'); }
      d.textContent = letra ? mostrar(letra) : '';
      g.appendChild(d);
    }
    c.appendChild(g);
  });
}
/* tocar una cajita no la selecciona: solo dice su sílaba */
$('cajas').addEventListener('click', e=>{
  const d = e.target.closest('.caja'); if(!d || !estado.destapada) return;
  reiniciarInactividad();
  hablar(silabaDe(palabraActual(), Number(d.dataset.i)));
});

/* ---------- teclas ---------- */
function tocarTecla(l){
  if(!estado.destapada || estado.ocupado) return;
  marcarTecla(l); reiniciarInactividad();
  if(estado.nivel.chequeo==='letra') escribirLetra(l); else escribirPalabra(l);
}

/* niveles 1 a 5: comprobación por letra al tocarla */
function escribirLetra(l){
  const real = norm(palabraActual().w);
  const i = cajaActiva(); if(i<0) return;
  quitarBrillo();
  if(l === real[i]){ acertarCaja(i, NOMBRES[l]); return; }
  estado.errores++; estado.erroresCaja[i]++;
  const paso = Math.min(estado.erroresCaja[i], 3);
  estado.ocupado = true; sonar.mal();
  pintarCajas({temporal:{i, l}});                       // 300 ms en rojo, solo esa cajita
  setTimeout(()=>{ estado.ocupado = false; escalon(i, paso, l); }, 300);
}
/* escalera de ayuda para la cajita i: 1 = explica, 2 = fantasma + tecla que brilla, 3 = el juego pone la letra */
function escalon(i, paso, tocada){
  const p = palabraActual(), nivel = estado.nivel;
  const correcta = norm(p.w)[i], nombre = NOMBRES[correcta];
  estado.ayudaMax = Math.max(estado.ayudaMax, paso);
  if(paso===1){
    if(nivel.id===1) mensaje(`🐣 Busca la ${mostrar(correcta)} 👇`, 'mal', `Esa es la ${NOMBRES[tocada]}. Busca la ${nombre}.`);
    else mensaje(`Casi… ${mostrar(silabaDe(p,i))} 👇`, 'mal', `Casi. Esa es la ${NOMBRES[tocada]}. ${silabaDe(p,i)}… ${p.w}.`);
    pintarCajas();
  } else if(paso===2){
    estado.fantasma = i; brillar(correcta); sonar.pista();
    mensaje(`💡 Mira: es la ${mostrar(correcta)}`, 'pista', `Mira: es la ${nombre}. Tócala.`);
    pintarCajas();
  } else {
    acertarCaja(i, `${capital(nombre)}. ${silabaDe(p,i)}… ${p.w}.`);
  }
  reiniciarInactividad();
}
function acertarCaja(i, voz){
  estado.escrito[i] = norm(palabraActual().w)[i];
  estado.bien[i] = true; estado.erroresCaja[i] = 0; estado.fantasma = -1;
  quitarBrillo(); sonar.tin();
  mensaje(estado.nivel.mensaje, '', false);
  pintarCajas({saltar:i});
  if(estado.escrito.every(x=>x)) celebrar();
  else { hablar(voz); reiniciarInactividad(); }
}

/* nivel 6: se escribe toda la palabra y se comprueba al llenarla (como siempre) */
function escribirPalabra(l){
  const i = cajaActiva(); if(i<0) return;
  estado.escrito[i]=l; sonar.tecla(); pintarCajas();
  if(estado.escrito.every(x=>x)) setTimeout(comprobar, 180);
  else hablar(NOMBRES[l]);
}
function borrar(){
  if(!estado.destapada || estado.ocupado || estado.nivel.chequeo!=='palabra') return;
  for(let i=estado.escrito.length-1;i>=0;i--){
    if(estado.escrito[i] && !estado.fijas[i]){ estado.escrito[i]=''; break; }
  }
  sonar.tecla(); pintarCajas();
}
async function comprobar(){
  if(estado.ocupado) return;
  const p = palabraActual(); const real = norm(p.w);
  if(estado.escrito.join('') === real){ celebrar(); return; }
  estado.errores++;
  const marcas = {};
  real.split('').forEach((ch,i)=>{ marcas[i] = (estado.escrito[i]===ch) ? 'bien' : 'mal'; });
  pintarCajas({marcas, bloquear:true});
  $('cajas').classList.add('temblar'); sonar.mal();
  if(estado.errores>=2) mensaje('Mira las letras rojas… ¿quieres una pista? 💡', 'mal', 'Mira las letras rojas. ¿Quieres una pista?');
  else mensaje('Casi… ¡inténtalo otra vez! 💪', 'mal', 'Casi. Inténtalo otra vez');
  estado.ocupado = true;
  await esperar(900);
  $('cajas').classList.remove('temblar');
  estado.escrito = estado.escrito.map((l,i)=> (l===real[i]) ? l : '');
  estado.ocupado = false;
  pintarCajas();
}

/* ---------- pista ---------- */
$('btn-pista').addEventListener('click', ()=>{
  if(!estado.destapada || estado.ocupado) return;
  reiniciarInactividad();
  if(estado.nivel.chequeo==='palabra'){ pistaPalabra(); return; }
  const i = cajaActiva(); if(i<0) return;
  const paso = estado.erroresCaja[i]>=2 ? 3 : 2;   // sube un escalón; desde 0 pasa directo al 2
  estado.erroresCaja[i] = paso;
  escalon(i, paso);
});
function pistaPalabra(){   // nivel 6: pone la siguiente letra correcta
  const p = palabraActual(); const real = norm(p.w);
  const i = estado.escrito.findIndex((l,k)=> l!==real[k]);
  if(i<0) return;
  estado.escrito[i] = real[i]; estado.fijas[i] = true; estado.pistas++;
  sonar.pista(); pintarCajas();
  mensaje('La letra es ' + mostrar(real[i]) + ' ✨', 'pista', NOMBRES[real[i]]);
  if(estado.escrito.every(x=>x)) setTimeout(comprobar, 400);
}
$('btn-saltar').addEventListener('click', ()=>{
  if($('juego').hidden || estado.ocupado) return;
  const p = palabraActual();
  estado.resultados.push({p, est:0});
  pintarDeck();
  siguiente();
});

/* ---------- estrellas y celebración ---------- */
function estrellasTarjeta(){
  const n = estado.nivel;
  if(n.chequeo==='palabra') return Math.max(1, 3 - estado.pistas - (estado.errores>0?1:0));
  if(n.id<=3) return 3;
  return Math.max(1, 3 - (estado.errores>0?1:0) - (estado.ayudaMax>=2?1:0));
}
async function celebrar(){
  estado.ocupado = true; cancelarTemporizadores(); quitarBrillo();
  const p = palabraActual(); const est = estrellasTarjeta();
  estado.estrellas += est;
  estado.resultados.push({p, est});
  $('estrellas').textContent = '⭐ ' + estado.estrellas;
  const marcas = {}; p.w.split('').forEach((_,i)=>{ marcas[i]='bien'; });
  pintarCajas({mostrarReal:true, bloquear:true, marcas, saltar:'todas'});
  $('silabas').textContent = silabas(p).map(s=>mostrar(s)).join(' · ');
  mensaje(['¡Súper! 🌟','¡Muy bien! 🎉','¡Eres genial! 💖','¡Lo lograste! 🦄','¡Bravo! 🎈'][Math.floor(Math.random()*5)], 'bien', false);
  sonar.bien(); confeti(est*40);
  $('teclado').classList.add('dormido'); $('btn-pista').disabled = true;
  pintarDeck(true);
  await esperar(300);
  const voz = hablar(`${silabas(p).join(', ')}. ¡${capital(p.w)}!`);
  // la tarjeta no se va hasta que la voz termina: mínimo 2 s y tope 3 s desde la celebración
  await Promise.race([Promise.all([voz, esperar(1700)]), esperar(2700)]);
  siguiente();
}

/* ---------- avanzar ---------- */
async function siguiente(){
  estado.ocupado = true; cancelarTemporizadores();
  const t = $('tarjeta');
  if(!reduceMotion){ t.classList.add('salir'); await esperar(560); }
  estado.idx++;
  if(estado.idx >= estado.lista.length){ terminar(); return; }
  cargarTarjeta();
  if(!reduceMotion){ t.classList.add('entrar'); await esperar(560); t.classList.remove('entrar'); }
  estado.ocupado = false;
  if(estado.idx < 2) hablar('Toca la tarjeta');
  programarTocar();
}

function pintarDeck(rebote){
  const d = $('deck'); d.innerHTML='';
  estado.lista.forEach((p,i)=>{
    const m = document.createElement('div'); m.className='mini';
    const r = estado.resultados[i];
    if(r){
      m.innerHTML = p.svg ? SVG[p.svg] : p.img; m.style.fontSize='22px';
      m.classList.add(r.est>0 ? 'lista' : 'saltada');
      if(rebote && i===estado.idx) m.classList.add('rebote');
    }
    else if(i===estado.idx){ m.classList.add('actual'); m.textContent='?'; }
    else m.textContent='?';
    d.appendChild(m);
  });
  const act = d.querySelector('.actual'); if(act && act.scrollIntoView) { try{ act.scrollIntoView({inline:'center', block:'nearest', behavior: reduceMotion?'auto':'smooth'}); }catch(e){} }
}

/* ---------- empezar y terminar ---------- */
function empezar(id){
  const nivel = nivelPorId(id); if(!nivel) return;
  ctxAudio(); cancelarTemporizadores();
  estado.nombre = ($('nombre').value||'').trim();
  guardar('nombre', estado.nombre);
  estado.nivel = nivel; estado.lista = listaParaNivel(nivel, estado.letra);
  estado.idx = 0; estado.estrellas = 0; estado.resultados = [];
  $('estrellas').textContent = '⭐ 0';
  $('juego').dataset.nivel = nivel.id;
  irA('juego');
  cargarTarjeta();
  hablar(`Nivel ${nivel.id}: ${nivel.nombre}. Toca la tarjeta.`);
  programarTocar();
}
function terminar(){
  cancelarTemporizadores();
  const nivel = estado.nivel;
  const total = estado.lista.length*3;
  const pct = total ? estado.estrellas/total : 0;
  $('medalla').textContent = pct>=0.9 ? '🏆' : pct>=0.7 ? '🥇' : pct>=0.5 ? '🌟' : '💪';
  $('final-titulo').textContent = estado.nombre ? `¡Eres una campeona, ${estado.nombre}!` : '¡Eres una campeona!';
  $('puntaje').textContent = `⭐ ${estado.estrellas} de ${total}`;
  $('final-texto').textContent = `Nivel ${nivel.id} ${nivel.emoji} ${nivel.nombre}. Estas fueron tus palabras:`;
  const r = $('repaso'); r.innerHTML='';
  estado.resultados.forEach(x=>{
    const s = document.createElement('span'); s.className = 'sticker' + (x.est===0 ? ' saltada' : '');
    const dib = document.createElement('span'); dib.className='dib'; dib.innerHTML = x.p.svg ? SVG[x.p.svg] : x.p.img;
    const nom = document.createElement('span'); nom.textContent = mostrar(x.p.w);
    const est = document.createElement('span'); est.textContent = x.est>0 ? '⭐'.repeat(x.est) : '·';
    s.append(dib, nom, est); r.appendChild(s);
  });
  const sig = (pct>=0.6 && nivel.id<6) ? nivelPorId(nivel.id+1) : null;
  $('btn-siguiente').hidden = !sig;
  if(sig) $('btn-siguiente').textContent = `➡️ ${sig.emoji} Siguiente nivel`;
  const mejor = mejorDe(nivel.id);
  if(!mejor || estado.estrellas > mejor.estrellas) guardar('mejor.'+nivel.id, {estrellas:estado.estrellas, total, nombre:estado.nombre});
  guardar('ultimoNivel', nivel.id);
  $('final-botones').hidden = true;
  irA('final'); sonar.final(); confeti(160);
  hablar('¡Felicitaciones ' + (estado.nombre||'') + '!' + (sig ? ' ¡Muy bien! ¿Vamos al siguiente nivel?' : ''));
  setTimeout(()=>{ confeti(90); $('final-botones').hidden = false; }, 1000);
}

/* ---------- botones ---------- */
$('btn-siguiente').addEventListener('click', ()=>{ if(estado.nivel) empezar(estado.nivel.id+1); });
$('btn-otra-vez').addEventListener('click', ()=>{ if(estado.nivel) empezar(estado.nivel.id); });
$('btn-inicio').addEventListener('click', ()=>{ callar(); pintarInicio(); irA('inicio'); });
$('btn-casa').addEventListener('click', ()=>{ callar(); cancelarTemporizadores(); pintarInicio(); irA('inicio'); });
$('btn-sonido').addEventListener('click', ()=>{
  sonido = !sonido; guardar('sonido', sonido);
  $('btn-sonido').textContent = sonido ? '🔊' : '🔇';
  $('btn-sonido').classList.toggle('apagado', !sonido);
  if(sonido){ ctxAudio(); sonar.tecla(); } else callar();
});
$('fichas').addEventListener('click', e=>{
  const b = e.target.closest('.ficha'); if(!b) return;
  estado.letra = b.dataset.letra;
  $('fichas').querySelectorAll('.ficha').forEach(f=>f.classList.toggle('on', f===b));
});
$('chk-minus').addEventListener('change', e=>{ minusculas = e.target.checked; guardar('minus', minusculas); pintarInicio(); });

/* ---------- arranque ---------- */
function arrancar(){
  $('nombre').value = leer('nombre','');
  $('chk-minus').checked = minusculas;
  $('btn-sonido').textContent = sonido ? '🔊' : '🔇';
  $('btn-sonido').classList.toggle('apagado', !sonido);
  pintarInicio();
  irA('inicio');
}
try{ if(window.claude && window.claude.hot && window.claude.hot.ready){ window.claude.hot.ready(arrancar); } else arrancar(); }catch(e){ arrancar(); }
})();
</script>
